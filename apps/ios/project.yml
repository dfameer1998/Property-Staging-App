name: SpaceStaging
options:
  bundleIdPrefix: com.spacestaging
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  SpaceStaging:
    type: application
    platform: iOS
    sources: [SpaceStaging]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacestaging.beta
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Space Staging
        INFOPLIST_KEY_NSCameraUsageDescription: Capture your room and measure its floor corners.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import photos and short videos into your private spaces.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record sound when you choose to capture a room video.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
