name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:db
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: apps/android
      - name: Report Android lint findings
        if: failure()
        run: cat apps/android/app/build/reports/lint-results-debug.txt
      - uses: actions/upload-artifact@v4
        with:
          name: space-staging-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      - run: xcodebuild -project SpaceStaging.xcodeproj -scheme SpaceStaging -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/ios
      - name: Capture iPhone simulator screen
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" build/Build/Products/Debug-iphonesimulator/SpaceStaging.app
          xcrun simctl launch "$device_id" com.spacestaging.beta
          sleep 3
          xcrun simctl io "$device_id" screenshot build/iphone-login.png
        working-directory: apps/ios
      - uses: actions/upload-artifact@v4
        with:
          name: space-staging-ios-simulator
          path: |
            apps/ios/build/iphone-login.png
            apps/ios/build/Build/Products/Debug-iphonesimulator/SpaceStaging.app
          retention-days: 14
